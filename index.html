<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2430;--mut:#7a7083;--ac:#6c4bd6;--ok:#1f9d63;--bad:#d64545;--ln:#2b2430;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141c;--card:#231f2b;--tx:#f1ecf7;--mut:#a79fb3;--ac:#9a82f5;--ok:#3dc98a;--bad:#f06a6a;--ln:#f1ecf7}}
:root[data-theme="dark"]{--bg:#17141c;--card:#231f2b;--tx:#f1ecf7;--mut:#a79fb3;--ac:#9a82f5;--ok:#3dc98a;--bad:#f06a6a;--ln:#f1ecf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:16px}
h1{text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:var(--mut);margin:0 0 18px;line-height:1.5}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px;background:var(--ac);color:#fff;font-weight:700}
.big{width:100%;margin-bottom:10px;font-size:1.05rem}
.alt{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px;gap:8px}
.bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:100%;background:var(--ac)}
.stf{width:100%;height:auto;display:block}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{padding:12px 0;font-size:1.2rem;line-height:1.1}
.keys small{display:block;font-weight:400;opacity:.75;font-size:.7rem}
.ok{background:var(--ok)!important;color:#fff!important}.no{background:var(--bad)!important;color:#fff!important}
.msg{text-align:center;min-height:1.6em;font-weight:700;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0;color:var(--mut)}
.hide{display:none!important}
.res{text-align:center;font-size:1.2rem}
.res b{font-size:2rem;color:var(--ac)}
.pill{background:#fff;color:#2b2430;border-radius:999px;padding:6px 14px;font-weight:800;border:0;font-size:.9rem}
#duel{position:fixed;inset:0;display:flex;flex-direction:column;z-index:5;background:#111;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{flex:1;display:flex;min-height:0;justify-content:center}
.wrap.t{background:#00c2f0}.wrap.b{background:#ff5f57}
.half{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px 14px;min-height:0;max-width:520px;width:100%}
.half.t{transform:rotate(180deg)}
.half .card{background:#fff;--ln:#2b2430;margin:0;padding:8px;border-radius:28px;border:4px solid #111}
.half .msg{color:#fff;margin:0;min-height:1.4em;font-size:.95rem;text-shadow:0 1px 2px #0006}
.half .keys button{background:#fff;color:#2b2430;border:3px solid #111;box-shadow:0 3px 0 #111;padding:10px 0}
#mid{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#111}
#mid .bar{flex:1;margin:0;background:#444}
.wrap{overflow:hidden}
.half .stf{max-height:21vh}
.half .card{padding:6px}
@media (max-height:780px){.half{padding:4px 14px;gap:4px}.half .stf{max-height:15vh}.half .keys button{padding:6px 0;font-size:1rem}.half .keys small{display:none}.half .msg{min-height:1em;font-size:.8rem}.half .keys.w2 button{padding:8px 4px;font-size:.85rem}}
#dsc small{margin-left:8px;opacity:.6}
.top{background:#4a3668;color:#fff;border-radius:18px;padding:14px;text-align:center;font-size:1.4rem;font-weight:900;margin-bottom:14px}
.tabs{display:flex;background:#dde7f5;border-radius:16px;padding:6px;gap:6px;margin-bottom:6px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;background:transparent;color:#3a4553;padding:10px 6px;font-size:1.1rem;font-weight:800}
.tabs button.on{background:#fff;box-shadow:0 1px 4px #0002}
.sec{font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 4px 8px;scroll-margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gc{position:relative;aspect-ratio:1/1.1;border-radius:22px;border:4px solid #1d1a24;overflow:hidden;cursor:pointer;box-shadow:0 6px 0 #0003;transition:transform .1s}
.gc:active{transform:scale(.96)}
.gc svg{position:absolute;inset:0;width:100%;height:100%}
.gc b{position:absolute;left:12px;right:8px;bottom:10px;color:#fff;font-size:1.35rem;line-height:1.05;font-weight:900;text-transform:uppercase;text-shadow:0 2px 0 #000a,0 0 6px #0006}
.gc em{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#14324a;color:#ffe940;border-radius:12px;padding:2px 12px;font-style:normal;font-weight:900;font-size:.9rem}
#trk{display:flex;height:34px;gap:3px;padding:2px 10px;background:#111}
#trk i{flex:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.9rem}
#trk u{width:22px;height:22px;border-radius:50%;background:#ffd23f;border:4px solid #111;display:block}
.keys.w2{grid-template-columns:1fr 1fr}
.half .keys.w2 button{font-size:1rem;padding:12px 6px}
#mem{position:fixed;inset:0;z-index:5;background:#3c4350;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#mt{font-weight:900;font-size:1.7rem;text-align:center;padding:12px 12px 0;text-shadow:0 2px 0 #0008}
#mr{font-size:1.6rem;min-height:2.2rem;color:#fff;font-weight:800}
#mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px 14px;width:100%;max-width:480px;flex:1;align-content:center}
.mc{aspect-ratio:1;border-radius:14px;border:4px solid #fff;background:#ffbc2e;font-size:1.35rem;font-weight:900;color:#2b2430;padding:0;box-shadow:0 4px 0 #0005}
.mc.o{background:#fff}.mc.d{visibility:hidden}
#mb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;max-width:480px;padding:10px 14px}
.top{display:flex;align-items:center;justify-content:center;gap:12px;background:#1f2a30}
.logo{width:84px;height:84px;border-radius:18px}
#chd{position:fixed;inset:0;z-index:5;background:#2f2a52;color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);overflow:auto}
#chd>*{width:100%;max-width:480px}
#ct{font-weight:900;font-size:1.45rem;text-align:center;text-shadow:0 2px 0 #0008}
#cs{text-align:center;opacity:.85;margin:6px 0 14px;min-height:2.4em}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cg button,.cq button{background:#fff;color:#2b2430;border:3px solid #111;box-shadow:0 3px 0 #111;padding:12px 0;font-size:1.2rem}
.cg button.s,.cq button.s{background:#ffbc2e}
.cb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
#cm{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
button:disabled{opacity:.45}
.ic{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.25em}.ic svg{display:block;width:100%;height:100%}
.xbtn{--s:46px;position:relative;width:var(--s);height:var(--s);padding:0;border-radius:50%;background:#fff;color:#2b2430;font-size:.6rem;font-weight:900;display:inline-flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:0;flex:none;box-shadow:0 2px 0 #0004}
#mid .xbtn{--s:38px}
.xbtn svg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);transform:rotate(-90deg)}
.xr{fill:none;stroke:#ff5f57;stroke-width:5;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:119.4;transition:stroke-dashoffset .12s}
.xbtn.hold .xr{stroke-dashoffset:0;transition:stroke-dashoffset .8s linear}
.xbtn.tip::after{content:attr(data-tip);position:absolute;top:112%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#111;color:#fff;padding:3px 8px;border-radius:8px;font-size:.7rem;z-index:20}
#hm{position:fixed;inset:0;z-index:5;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#hm>*{max-width:480px;margin-left:auto;margin-right:auto}
.hh{display:flex;justify-content:space-between;align-items:center;gap:8px}.hh b{font-size:1.02rem}
#hi{font-size:.8rem;color:var(--mut);margin:6px auto;line-height:1.55}
.hcard{background:#fff;border-radius:16px;padding:6px;box-shadow:0 2px 10px #0002;touch-action:manipulation}#hs{width:100%;height:auto;display:block}
#hv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;margin-bottom:8px}
.hvb{background:var(--c);color:#fff;padding:8px 2px;font-size:1rem;opacity:.55;border:3px solid transparent;line-height:1.15}.hvb.on{opacity:1;border-color:#111}.hvb small{display:block;font-size:.62rem;font-weight:600}
#ha{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:6px}
.he{background:var(--card);border-radius:12px;padding:8px 10px;margin:6px auto;border-left:6px solid var(--c);font-size:.9rem}.he .fa{font-size:.82rem;color:var(--mut);margin-top:3px}
.hbd{border-radius:10px;padding:1px 8px;font-weight:800;font-size:.65rem;color:#fff;margin-left:6px;vertical-align:1px}
.hsc{text-align:center;font-weight:800;font-size:1.05rem;margin:8px 0}.hsc b{font-size:1.8rem;color:var(--ac)}
#hr details{margin:8px auto}#hr summary{font-weight:800;padding:6px 0}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body.fa{font-family:Vazirmatn,Tahoma,'Segoe UI',system-ui,sans-serif}
.lang{display:flex;justify-content:center;gap:6px;margin:0 0 10px}
.lang button{background:#dde7f5;color:#3a4553;padding:6px 16px;border-radius:999px;font-size:.85rem;font-weight:800}
.lang button.on{background:#1f2a30;color:#fff}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg{-webkit-user-drag:none}img{pointer-events:none}
.lang #mu{width:36px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:#1f2a30}.lang #mu svg{width:18px;height:18px}.lang #mu .sl{display:none}.lang #mu.off .sl{display:block}.lang #mu.off .sw{display:none}
#gi{position:fixed;inset:0;z-index:6;background:#dbeaf7;display:flex;flex-direction:column;align-items:center;overflow:auto}
#gh{width:100%;min-height:150px;flex:none;display:flex;align-items:flex-end;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 56px}
#gt{font-size:2rem;font-weight:900;color:#fff;text-transform:uppercase;text-align:center;text-shadow:0 3px 0 #0007,0 0 10px #0004;line-height:1.05}
#gc{width:calc(100% - 32px);max-width:440px;margin-top:-36px;flex:none;background:#fff;border-radius:28px;padding:18px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 6px 18px #0002;color:#2b2430}
#gd{margin:0;width:100%;font-weight:800;font-size:1.02rem;line-height:1.6;text-align:start}
#ga{width:min(58%,220px);aspect-ratio:1/1.1;border-radius:22px;border:4px solid #1d1a24;overflow:hidden;position:relative}#ga svg{position:absolute;inset:0;width:100%;height:100%}
#gp{width:80%;max-width:300px;padding:12px;border-radius:999px;background:#329fa9;color:#fbc65d;font-size:2rem;font-weight:600;letter-spacing:.05em;box-shadow:0 5px 0 #23737a}
#gb{margin:20px 0 28px;flex:none;background:#e0907a;color:#fff;padding:12px 46px;border-radius:16px;font-size:1.2rem;font-weight:800;box-shadow:0 5px 0 #b86b57}
</style>
</head>

const TRP=[[/^Player (\d) missed!$/,'بازیکن $1 اشتباه زد!'],[/^Player (\d) was first! \+(\d+)$/,'بازیکن $1 زودتر بود! +$2'],[/^Player (\d) was first! Pull!$/,'بازیکن $1 زودتر بود! بکش!'],[/^Correct! \+(\d+)$/,'درسته! +$1'],[/^Time's up! Answer: (.+)$/,'وقت تموم شد! جواب: $1'],[/^Both missed! Answer: (.+)$/,'هر دو اشتباه زدن! جواب: $1'],[/^Answer: (.+)$/,'جواب: $1'],[/^Best: (\d+)$/,'رکورد: $1'],[/^Winner: Player (\d)$/,'برنده: بازیکن $1'],[/^Player (\d)'s Turn$/,'نوبت بازیکن $1'],[/^Player (\d): pick a chord$/,'بازیکن $1: یک آکورد انتخاب کن'],[/^Player (\d), look away!$/,'بازیکن $1، چشمت رو ببند!'],[/^Player (\d): your turn$/,'بازیکن $1: نوبت توئه'],[/^Player (\d) locked a chord\. Ready to listen\?$/,'بازیکن $1 آکورد رو قفل کرد. آماده‌ی شنیدنی؟'],[/^Player (\d): what chord is it\?$/,'بازیکن $1: این چه آکوردیه؟'],[/^Bot's test: what chord is it\?$/,'آزمون ربات: این چه آکوردیه؟'],[/^It was (.+)$/,'درست: $1'],[/^— you said (.+)$/,'— تو گفتی $1'],[/^(.+) (major|minor)$/,'$1 $2'],[/^(.[♯♭]?) \((Do|Re|Mi|Fa|Sol|La|Si)\)$/,'$1 ($2)'],[/^Round (\d+)\/(\d+)$/,'دور $1 از $2'],[/^Player (\d) · Round (\d+)\/(\d+)$/,'بازیکن $1 · دور $2 از $3'],[/^Player (\d): (\d+)\/100$/,'بازیکن $1: $2/100'],[/^Player (\d) is done\.$/,'بازیکن $1 کارش رو تموم کرد.'],[/^Player (\d)\.$/,'بازیکن $1.'],[/^Which (major|minor) key\?$/,'کدوم گام $1؟']];
function tr(s){const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),c=m[2];if(!c)return s;let o=TRD[c];if(o===undefined)for(const [re,f] of TRP){const r=c.match(re);if(r){o=f.replace(/\$(\d)/g,(_,i)=>tr(r[i]));break}}return o===undefined?s:m[1]+o+m[3]}
const ORG=new WeakMap();
function trans(){
  document.querySelectorAll('.he,.msg,#hi,#cs,.hsc,#mt,#mr').forEach(e=>e.dir='auto');
  if(LANG!='fa')return;
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),ns=[];
  for(let n;n=w.nextNode();){const p=n.parentNode;if(/^(SCRIPT|STYLE)$/i.test(p.nodeName)||p.closest('svg'))continue;ns.push(n)}
  ns.forEach(n=>{const o=ORG.has(n)?ORG.get(n):n.nodeValue,f=tr(o);if(f!==o){ORG.set(n,o);n.nodeValue=f}});
  document.querySelectorAll('svg text').forEach(t=>{const o=t.dataset.o||t.textContent,f=tr(o);if(f!==o){t.dataset.o=o;t.textContent=f}});
}
function setLang(l){

  trans();mo.observe(document.body,{childList:true,subtree:true,characterData:true});
}

const SMP={};let smpOn=false;
function acx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();return ac}
function loadSamples(){if(smpOn)return;smpOn=true;for(let m=40;m<=83;m++)fetch('sounds/p'+m+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(a=>acx().decodeAudioData(a)).then(b=>{SMP[m]=b}).catch(()=>{})}
function pn(m,delay,gain){try{const c=acx(),t=c.currentTime+(delay||0),g=c.createGain(),b=SMP[m];loadSamples();
  if(b){const s=c.createBufferSource();s.buffer=b;g.gain.value=gain||.8;s.connect(g);g.connect(c.destination);s.start(t)}
  else{const o=c.createOscillator();o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+1.2);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1.3)}}catch(e){}}
function play(d){const s=d+2;pn(12*(4+Math.floor(s/7)+1)+SEMI[s%7],0,.75)}
function playChord(c,arp){[0,c.q?3:4,7].forEach((iv,k)=>pn(60+c.r+iv,arp?k*.4:0,.6))}
function playMidi(ms,delay){ms.forEach(m=>pn(m,delay||0,ms.length>1?.5:.8))}
const MUS=new Audio('sounds/menu.mp3');MUS.loop=true;MUS.preload='auto';MUS.volume=.45;
let muOn=true,muFade=0;try{muOn=localStorage.getItem('mus')!='0'}catch(e){}
function muTo(v,done){clearInterval(muFade);muFade=setInterval(()=>{const d=v-MUS.volume;if(Math.abs(d)<.05){MUS.volume=v;clearInterval(muFade);if(done)done()}else MUS.volume=Math.max(0,Math.min(1,MUS.volume+Math.sign(d)*.05))},40)}
function musicSync(id){const want=(id=='menu'||id=='gi')&&muOn&&!document.hidden;if(want){MUS.play().then(()=>muTo(.45)).catch(()=>{})}else if(!MUS.paused)muTo(0,()=>MUS.pause())}
